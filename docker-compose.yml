services:
  mercari-agent-web:
    build: .
    container_name: mercari-agent-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
