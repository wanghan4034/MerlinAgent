<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercari 爬虫控制台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .card { border: none; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .chip { border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Mercari 爬虫可视化控制台 Pro</h2>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary" onclick="refreshAll()">刷新数据</button>
      <button class="btn btn-outline-dark" onclick="loadJobs()">刷新任务列表</button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">总商品数</div><div id="stat-total" class="fs-4 fw-bold">-</div></div></div>
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">关键词数</div><div id="stat-keywords" class="fs-4 fw-bold">-</div></div></div>
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">已售商品</div><div id="stat-sold" class="fs-4 fw-bold">-</div></div></div>
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">均价</div><div id="stat-avg-price" class="fs-4 fw-bold">-</div><div id="stat-last" class="small mono text-muted"></div></div></div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-8">
      <div class="card p-3 h-100">
        <h5>启动抓取任务</h5>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">关键词（逗号分隔）</label>
            <input id="keywords" class="form-control" value="ポケモンカード,ニンテンドースイッチ" />
          </div>
          <div class="col-md-2">
            <label class="form-label">页数</label>
            <input id="max-pages" class="form-control" type="number" value="1" min="1" max="20" />
          </div>
          <div class="col-md-2">
            <label class="form-label">间隔秒</label>
            <input id="wait-seconds" class="form-control" type="number" value="1.5" step="0.1" min="0.1" />
          </div>
          <div class="col-md-2">
            <label class="form-label">超时(ms)</label>
            <input id="timeout-ms" class="form-control" type="number" value="30000" min="1000" />
          </div>
          <div class="col-md-6">
            <label class="form-label">SQLite 路径</label>
            <input id="db-path" class="form-control" value="data/mercari_items.db" />
          </div>
          <div class="col-md-6">
            <label class="form-label">JSONL 路径</label>
            <input id="output-path" class="form-control" value="output/mercari_items.jsonl" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Telegram Bot Token（可选）</label>
            <input id="tg-token" class="form-control" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Telegram Chat ID（可选）</label>
            <input id="tg-chat" class="form-control" />
          </div>
          <div class="col-md-4">
            <label class="form-label">飞书 Webhook（可选）</label>
            <input id="feishu" class="form-control" />
          </div>

          <div class="col-md-4">
            <label class="form-label">代理地址（可选）</label>
            <input id="proxy-server" class="form-control" placeholder="socks5://host:port" />
          </div>
          <div class="col-md-4">
            <label class="form-label">代理用户名（可选）</label>
            <input id="proxy-username" class="form-control" />
          </div>
          <div class="col-md-4">
            <label class="form-label">代理密码（可选）</label>
            <input id="proxy-password" class="form-control" type="password" />
          </div>
        </div>
        <div class="d-flex gap-3 mt-3 align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="notify-all">
            <label class="form-check-label" for="notify-all">通知所有抓取项</label>
          </div>
          <button class="btn btn-primary" onclick="startJob()">开始抓取</button>
          <span id="run-msg" class="text-muted"></span>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card p-3 h-100">
        <h5>配置模板</h5>
        <label class="form-label">模板名</label>
        <input id="profile-name" class="form-control" placeholder="例如：高频监控模板" />
        <div class="d-flex gap-2 mt-2">
          <button class="btn btn-sm btn-outline-primary" onclick="saveProfile()">保存当前配置</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadProfiles()">刷新模板</button>
        </div>
        <div class="mt-3 small text-muted">点击模板可一键载入：</div>
        <div id="profiles" class="d-flex flex-wrap gap-2 mt-2"></div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-7">
      <div class="card p-3">
        <h5>任务状态</h5>
        <pre id="job-state" class="mono small mb-0">暂无任务</pre>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card p-3">
        <h5>最近任务</h5>
        <div id="job-list" class="small"></div>
      </div>
    </div>
  </div>

  <div class="card p-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">最近商品</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="loadItems()">刷新表格</button>
    </div>

    <div class="row g-2 mb-2">
      <div class="col-md-3"><input id="filter-q" class="form-control form-control-sm" placeholder="标题关键词" /></div>
      <div class="col-md-2"><input id="filter-keyword" class="form-control form-control-sm" placeholder="精确关键词" /></div>
      <div class="col-md-2"><input id="filter-min-price" class="form-control form-control-sm" type="number" placeholder="最低价" /></div>
      <div class="col-md-2"><input id="filter-max-price" class="form-control form-control-sm" type="number" placeholder="最高价" /></div>
      <div class="col-md-2">
        <select id="filter-sold" class="form-select form-select-sm">
          <option value="0">全部状态</option>
          <option value="1">仅已售</option>
        </select>
      </div>
      <div class="col-md-1"><button class="btn btn-sm btn-dark w-100" onclick="loadItems()">筛选</button></div>
    </div>

    <div class="table-responsive">
      <table class="table table-sm table-striped align-middle">
        <thead><tr><th>标题</th><th>关键词</th><th>价格</th><th>卖家</th><th>SOLD</th><th>出现次数</th><th>最后出现</th></tr></thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let currentJobId = null;

function getPayload() {
  return {
    keywords: document.getElementById('keywords').value,
    max_pages: Number(document.getElementById('max-pages').value),
    wait_seconds: Number(document.getElementById('wait-seconds').value),
    timeout_ms: Number(document.getElementById('timeout-ms').value),
    db_path: document.getElementById('db-path').value,
    output_path: document.getElementById('output-path').value,
    telegram_bot_token: document.getElementById('tg-token').value,
    telegram_chat_id: document.getElementById('tg-chat').value,
    feishu_webhook: document.getElementById('feishu').value,
    proxy_server: document.getElementById('proxy-server').value,
    proxy_username: document.getElementById('proxy-username').value,
    proxy_password: document.getElementById('proxy-password').value,
    notify_all: document.getElementById('notify-all').checked,
  };
}

function applyPayload(data) {
  document.getElementById('keywords').value = data.keywords || '';
  document.getElementById('max-pages').value = data.max_pages || 1;
  document.getElementById('wait-seconds').value = data.wait_seconds || 1.5;
  document.getElementById('timeout-ms').value = data.timeout_ms || 30000;
  document.getElementById('db-path').value = data.db_path || 'data/mercari_items.db';
  document.getElementById('output-path').value = data.output_path || 'output/mercari_items.jsonl';
  document.getElementById('tg-token').value = data.telegram_bot_token || '';
  document.getElementById('tg-chat').value = data.telegram_chat_id || '';
  document.getElementById('feishu').value = data.feishu_webhook || '';
  document.getElementById('proxy-server').value = data.proxy_server || '';
  document.getElementById('proxy-username').value = data.proxy_username || '';
  document.getElementById('proxy-password').value = data.proxy_password || '';
  document.getElementById('notify-all').checked = !!data.notify_all;
}

async function startJob() {
  const msg = document.getElementById('run-msg');
  msg.textContent = '任务提交中...';
  const resp = await fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(getPayload()),
  });
  const data = await resp.json();
  if (!resp.ok) {
    msg.textContent = '提交失败: ' + (data.error || 'unknown error');
    return;
  }
  currentJobId = data.job_id;
  msg.textContent = '任务已提交: ' + currentJobId;
  pollJob();
  loadJobs();
}

async function pollJob() {
  if (!currentJobId) return;
  const resp = await fetch('/api/job/' + currentJobId);
  const data = await resp.json();
  document.getElementById('job-state').textContent = JSON.stringify(data, null, 2);
  if (data.status === 'running' || data.status === 'queued') {
    setTimeout(pollJob, 2000);
  } else {
    refreshAll();
    loadJobs();
  }
}

async function loadJobs() {
  const resp = await fetch('/api/jobs?limit=8');
  const rows = await resp.json();
  const el = document.getElementById('job-list');
  el.innerHTML = rows.map((row) => {
    const cls = row.status === 'completed' ? 'bg-success-subtle text-success' :
      row.status === 'failed' ? 'bg-danger-subtle text-danger' : 'bg-warning-subtle text-warning';
    return `<div class="mb-2"><span class="chip ${cls}">${row.status}</span> <span class="mono">${row.job_id.slice(0, 10)}</span><div class="text-muted">${row.created_at}</div></div>`;
  }).join('') || '<div class="text-muted">暂无任务记录</div>';
}

async function loadStats() {
  const dbPath = encodeURIComponent(document.getElementById('db-path').value);
  const resp = await fetch('/api/stats?db_path=' + dbPath);
  const data = await resp.json();
  document.getElementById('stat-total').textContent = data.total_items;
  document.getElementById('stat-keywords').textContent = data.distinct_keywords;
  document.getElementById('stat-sold').textContent = data.sold_items;
  document.getElementById('stat-avg-price').textContent = data.avg_price ? `¥${data.avg_price}` : '-';
  document.getElementById('stat-last').textContent = data.last_seen_at ? ('最后更新: ' + data.last_seen_at) : '最后更新: -';
}

async function loadItems() {
  const dbPath = encodeURIComponent(document.getElementById('db-path').value);
  const q = encodeURIComponent(document.getElementById('filter-q').value || '');
  const keyword = encodeURIComponent(document.getElementById('filter-keyword').value || '');
  const minPrice = encodeURIComponent(document.getElementById('filter-min-price').value || '');
  const maxPrice = encodeURIComponent(document.getElementById('filter-max-price').value || '');
  const soldOnly = document.getElementById('filter-sold').value;

  const url = `/api/items?db_path=${dbPath}&limit=50&q=${q}&keyword=${keyword}&min_price=${minPrice}&max_price=${maxPrice}&sold_only=${soldOnly}`;
  const resp = await fetch(url);
  const data = await resp.json();
  const body = document.getElementById('items-body');
  body.innerHTML = '';
  for (const row of data) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a href="${row.item_url}" target="_blank">${row.title}</a></td>
      <td>${row.keyword}</td>
      <td>${row.price_jpy ?? '-'}</td>
      <td>${row.seller_name ?? '-'}</td>
      <td>${row.is_sold ? '是' : '否'}</td>
      <td>${row.occurrence_count}</td>
      <td class="mono">${row.last_seen_at}</td>
    `;
    body.appendChild(tr);
  }
}

async function saveProfile() {
  const name = document.getElementById('profile-name').value.trim();
  if (!name) {
    alert('请先输入模板名');
    return;
  }
  const resp = await fetch('/api/profiles', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, config: getPayload() }),
  });
  const data = await resp.json();
  if (!resp.ok) {
    alert('保存失败: ' + (data.error || 'unknown'));
    return;
  }
  loadProfiles();
}

async function deleteProfile(name) {
  const resp = await fetch('/api/profiles/' + encodeURIComponent(name), { method: 'DELETE' });
  if (resp.ok) loadProfiles();
}

async function loadProfiles() {
  const resp = await fetch('/api/profiles');
  const data = await resp.json();
  const container = document.getElementById('profiles');
  container.innerHTML = '';

  const names = Object.keys(data);
  if (!names.length) {
    container.innerHTML = '<span class="text-muted small">暂无模板</span>';
    return;
  }

  for (const name of names) {
    const wrapper = document.createElement('div');
    wrapper.className = 'border rounded px-2 py-1 bg-white';
    wrapper.innerHTML = `<strong>${name}</strong>
      <div class="d-flex gap-2 mt-1">
        <button class="btn btn-sm btn-outline-primary">载入</button>
        <button class="btn btn-sm btn-outline-danger">删除</button>
      </div>`;
    const [loadBtn, delBtn] = wrapper.querySelectorAll('button');
    loadBtn.onclick = () => applyPayload(data[name].config || {});
    delBtn.onclick = () => deleteProfile(name);
    container.appendChild(wrapper);
  }
}

function refreshAll() {
  loadStats();
  loadItems();
}

refreshAll();
loadJobs();
loadProfiles();
</script>
</body>
</html>
