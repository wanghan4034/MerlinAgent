<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercari 爬虫控制台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .card { border: none; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .chip { border-radius: 999px; padding: 4px 10px; font-size: 12px; }
    .item-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; background: #f1f1f1; }
    .item-card .title { height: 42px; overflow: hidden; font-size: 13px; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Mercari 爬虫可视化控制台 Pro</h2>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary" onclick="refreshAll()">刷新数据</button>
      <button class="btn btn-outline-dark" onclick="loadJobs()">刷新任务</button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">总商品数</div><div id="stat-total" class="fs-4 fw-bold">-</div></div></div>
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">关键词数</div><div id="stat-keywords" class="fs-4 fw-bold">-</div></div></div>
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">已售商品</div><div id="stat-sold" class="fs-4 fw-bold">-</div></div></div>
    <div class="col-md-3"><div class="card p-3"><div class="text-muted">均价</div><div id="stat-avg-price" class="fs-4 fw-bold">-</div><div id="stat-last" class="small mono text-muted"></div></div></div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-8">
      <div class="card p-3 h-100">
        <h5>快速抓取（业务模式）</h5>
        <div class="row g-2">
          <div class="col-md-8">
            <label class="form-label">商品关键词（逗号分隔）</label>
            <input id="keywords" class="form-control" value="chanel" placeholder="例如：chanel, lv, ポケモンカード" />
          </div>
          <div class="col-md-4">
            <label class="form-label">抓取页数</label>
            <input id="max-pages" class="form-control" type="number" value="2" min="1" max="20" />
          </div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" onclick="startJob()">开始抓取</button>
          <button class="btn btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#advanced">高级设置</button>
          <span id="run-msg" class="text-muted align-self-center"></span>
        </div>

        <div id="advanced" class="collapse mt-3">
          <div class="border rounded p-3 bg-light">
            <div class="small text-muted mb-2">开发/运维设置（默认由后台配置，不建议业务同学修改）</div>
            <div class="row g-2">
              <div class="col-md-3"><input id="wait-seconds" class="form-control form-control-sm" type="number" value="1.5" step="0.1" min="0.1" placeholder="间隔秒" /></div>
              <div class="col-md-3"><input id="timeout-ms" class="form-control form-control-sm" type="number" value="30000" min="1000" placeholder="超时(ms)" /></div>
              <div class="col-md-3"><input id="goto-retries" class="form-control form-control-sm" type="number" value="2" min="0" placeholder="重试次数" /></div>
              <div class="col-md-3"><input id="retry-backoff-seconds" class="form-control form-control-sm" type="number" value="2" min="0.2" step="0.1" placeholder="重试间隔" /></div>
              <div class="col-md-4"><input id="proxy-server" class="form-control form-control-sm" placeholder="代理 socks5://host.docker.internal:10808" /></div>
              <div class="col-md-4"><input id="db-path" class="form-control form-control-sm" value="data/mercari_items.db" placeholder="SQLite 路径" /></div>
              <div class="col-md-4"><input id="output-path" class="form-control form-control-sm" value="output/mercari_items.jsonl" placeholder="JSONL 路径" /></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card p-3 h-100">
        <h5>最近任务</h5>
        <div id="job-list" class="small"></div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-7">
      <div class="card p-3">
        <h5>任务结果摘要</h5>
        <div id="job-summary" class="small text-muted">暂无任务</div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card p-3">
        <h5>任务原始信息</h5>
        <pre id="job-state" class="mono small mb-0" style="max-height:180px;overflow:auto">暂无任务</pre>
      </div>
    </div>
  </div>

  <div class="card p-3 mb-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">商品看板（最新物品 + 图片）</h5>
      <button class="btn btn-sm btn-outline-secondary" onclick="loadItems()">刷新</button>
    </div>
    <div class="row g-2 mb-2">
      <div class="col-md-3"><input id="filter-q" class="form-control form-control-sm" placeholder="标题关键词" /></div>
      <div class="col-md-2"><input id="filter-keyword" class="form-control form-control-sm" placeholder="精确关键词" /></div>
      <div class="col-md-2"><input id="filter-min-price" class="form-control form-control-sm" type="number" placeholder="最低价" /></div>
      <div class="col-md-2"><input id="filter-max-price" class="form-control form-control-sm" type="number" placeholder="最高价" /></div>
      <div class="col-md-2">
        <select id="filter-sold" class="form-select form-select-sm">
          <option value="0">全部状态</option>
          <option value="1">仅已售</option>
        </select>
      </div>
      <div class="col-md-1"><button class="btn btn-sm btn-dark w-100" onclick="loadItems()">筛选</button></div>
    </div>
    <div class="small text-muted mb-2">默认按最近抓取时间倒序展示最新商品，并展示商品图片。</div>
    <div id="item-grid" class="row g-3"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentJobId = null;

function getPayload() {
  return {
    keywords: document.getElementById('keywords').value,
    max_pages: Number(document.getElementById('max-pages').value),
    wait_seconds: Number(document.getElementById('wait-seconds').value || 1.5),
    timeout_ms: Number(document.getElementById('timeout-ms').value || 30000),
    db_path: document.getElementById('db-path').value || 'data/mercari_items.db',
    output_path: document.getElementById('output-path').value || 'output/mercari_items.jsonl',
    proxy_server: document.getElementById('proxy-server').value || '',
    goto_retries: Number(document.getElementById('goto-retries').value || 2),
    retry_backoff_seconds: Number(document.getElementById('retry-backoff-seconds').value || 2),
  };
}

function renderJobSummary(data) {
  const el = document.getElementById('job-summary');
  if (!data || !data.status) {
    el.textContent = '暂无任务';
    return;
  }
  const result = data.result || {};
  const err = data.error ? ` | 错误: ${data.error}` : '';
  el.textContent = `状态: ${data.status} | 抓取: ${result.total_scraped ?? '-'} | 新增: ${result.total_new ?? '-'}${err}`;
}

async function startJob() {
  const msg = document.getElementById('run-msg');
  msg.textContent = '任务提交中...';
  const resp = await fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(getPayload()),
  });
  const data = await resp.json();
  if (!resp.ok) {
    msg.textContent = '提交失败: ' + (data.error || 'unknown error');
    return;
  }
  currentJobId = data.job_id;
  msg.textContent = '任务已提交: ' + currentJobId;
  pollJob();
  loadJobs();
}

async function pollJob() {
  if (!currentJobId) return;
  const resp = await fetch('/api/job/' + currentJobId);
  const data = await resp.json();
  document.getElementById('job-state').textContent = JSON.stringify(data, null, 2);
  renderJobSummary(data);
  if (data.status === 'running' || data.status === 'queued') {
    setTimeout(pollJob, 2000);
  } else {
    refreshAll();
    loadJobs();
  }
}

async function loadJobs() {
  const resp = await fetch('/api/jobs?limit=8');
  const rows = await resp.json();
  const el = document.getElementById('job-list');
  el.innerHTML = rows.map((row) => {
    const cls = row.status === 'completed' ? 'bg-success-subtle text-success' :
      row.status === 'failed' ? 'bg-danger-subtle text-danger' : 'bg-warning-subtle text-warning';
    return `<div class="mb-2"><span class="chip ${cls}">${row.status}</span> <span class="mono">${row.job_id.slice(0, 10)}</span><div class="text-muted">${row.created_at}</div></div>`;
  }).join('') || '<div class="text-muted">暂无任务记录</div>';
}

async function loadStats() {
  const dbPath = encodeURIComponent(document.getElementById('db-path').value || 'data/mercari_items.db');
  const resp = await fetch('/api/stats?db_path=' + dbPath);
  const data = await resp.json();
  document.getElementById('stat-total').textContent = data.total_items;
  document.getElementById('stat-keywords').textContent = data.distinct_keywords;
  document.getElementById('stat-sold').textContent = data.sold_items;
  document.getElementById('stat-avg-price').textContent = data.avg_price ? `¥${data.avg_price}` : '-';
  document.getElementById('stat-last').textContent = data.last_seen_at ? ('最后更新: ' + data.last_seen_at) : '最后更新: -';
}

function esc(x) {
  return String(x ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
}

async function loadItems() {
  const dbPath = encodeURIComponent(document.getElementById('db-path').value || 'data/mercari_items.db');
  const q = encodeURIComponent(document.getElementById('filter-q').value || '');
  const keyword = encodeURIComponent(document.getElementById('filter-keyword').value || '');
  const minPrice = encodeURIComponent(document.getElementById('filter-min-price').value || '');
  const maxPrice = encodeURIComponent(document.getElementById('filter-max-price').value || '');
  const soldOnly = document.getElementById('filter-sold').value;

  const url = `/api/items?db_path=${dbPath}&limit=60&q=${q}&keyword=${keyword}&min_price=${minPrice}&max_price=${maxPrice}&sold_only=${soldOnly}`;
  const resp = await fetch(url);
  const data = await resp.json();
  const grid = document.getElementById('item-grid');

  if (!data.length) {
    grid.innerHTML = '<div class="text-muted">暂无数据</div>';
    return;
  }

  grid.innerHTML = data.map((row) => {
    const sold = row.is_sold ? '<span class="badge text-bg-danger">SOLD</span>' : '<span class="badge text-bg-success">在售</span>';
    return `
      <div class="col-md-3 col-sm-6">
        <div class="card p-2 item-card h-100">
          <img src="${esc(row.image_url || '')}" alt="商品图片" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x200?text=No+Image';" />
          <div class="mt-2 title">${esc(row.title)}</div>
          <div class="d-flex justify-content-between align-items-center mt-1">
            <strong>¥${esc(row.price_jpy ?? '-')}</strong>${sold}
          </div>
          <div class="small text-muted">关键词: ${esc(row.keyword)}</div>
          <div class="small text-muted">卖家: ${esc(row.seller_name || '-')}</div>
          <div class="small text-muted">最近出现: ${esc(row.last_seen_at || row.first_seen_at || '-')}</div>
          <a class="btn btn-sm btn-outline-primary mt-2" target="_blank" href="${esc(row.item_url)}">打开商品</a>
        </div>
      </div>
    `;
  }).join('');
}

function refreshAll() {
  loadStats();
  loadItems();
}

refreshAll();
loadJobs();
</script>
</body>
</html>
